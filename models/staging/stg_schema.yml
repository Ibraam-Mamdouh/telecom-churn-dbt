version: 2

models:
  - name: stg_customer_churn
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: customer_status
        tests:
          - accepted_values:
              arguments:
                values: ['Stayed', 'Churned', 'Joined']
      - name: contract_type
        tests:
          - accepted_values:
              arguments:
                values: ['Month-to-Month', 'One Year', 'Two Year']

  - name: stg_zipcode_population
    columns:
      - name: zip_code
        tests: [unique, not_null]